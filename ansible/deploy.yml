---
# ~/iac_lab/ansible/deploy.yml
# Phase "deploy": p Windows-Server-VMs aus dem Folder-Template klonen,
# Slot-Spec anwenden, einschalten, warten bis Customization abgeschlossen
# und eine IP gemeldet ist (Messpunkt B).
#
#   cd ~/iac_lab/ansible && source ~/iac_lab/secrets.env
#   ansible-playbook -f <p> -e vm_count=<p> deploy.yml
#
# Exit-Code 0 nur, wenn alle p VMs erfolgreich durchgelaufen sind.
# Ob das Ergebnis stimmt, entscheidet anschliessend validate_vms.py.

- name: Stufe auswaehlen
  ansible.builtin.import_playbook: select_slots.yml

- name: Deploy - klonen, anpassen, einschalten (Messpunkt B)
  hosts: wab_vms
  gather_facts: false
  strategy: linear          # explizit statt Default, s. Kontext_WAB.md
  vars_files:
    - ../inventory.yaml

  tasks:
    - name: Sicherheitspruefung - nur Slot-VMs dieses Werkzeugs
      ansible.builtin.assert:
        that:
          - inventory_hostname is match('^' ~ naming.ansible_prefix ~ '[0-9]{2}$')
          - inventory_hostname != template_name
        quiet: true

    - name: VM klonen und bis Customization + IP warten
      community.vmware.vmware_guest:
        # Verbindung: VMWARE_HOST/_USER/_PASSWORD/_VALIDATE_CERTS aus secrets.env
        datacenter: "{{ datacenter }}"
        esxi_hostname: "{{ esxi_hostname }}"     # kein Cluster vorhanden; Host 3 fest
        datastore: "{{ datastore }}"             # lokales VMFS von Host 3, wie Template
        folder: "{{ an_vcenter_folder }}"
        name: "{{ inventory_hostname }}"
        template: "{{ template_name }}"   # Pfad (an_template_path/...) wurde nicht aufgeloest; Name im Datacenter eindeutig
        linked_clone: false                      # Full Clone, explizit
        state: poweredon
        hardware:
          num_cpus: "{{ hardware.num_cpus | int }}"
          memory_mb: "{{ hardware.memory_mb | int }}"
        disk:
          - size_gb: "{{ hardware.disk_size_gb | int }}"
            type: "{{ 'thin' if (hardware.disk_thin | bool) else 'thick' }}"
        # networks bewusst weggelassen: NIC (VMXNET3, Ziel-Portgruppe) kommt
        # unveraendert aus dem Template, Netzwerkkonfiguration ausschliesslich
        # aus der Slot-Spec. networks[].type hat laut Doku Default "dhcp" und
        # ist ein Customization-Parameter - das soll nicht in die Spec greifen.
        customization_spec: "{{ wab_slot_spec }}"
        wait_for_customization: true
        wait_for_customization_timeout: "{{ (timeouts_min.customization | int) * 60 }}"
        wait_for_ip_address: true
        wait_for_ip_address_timeout: "{{ (timeouts_min.guest_net | int) * 60 }}"
        # Kein Gegenstueck zu Terraforms clone.timeout (timeouts_min.clone):
        # vmware_guest kennt keinen Clone-Timeout.
      register: wab_deploy

    - name: Idempotenz-Schutz - VM muss in diesem Lauf neu entstanden sein
      # Zweite Schicht hinter der precheck-Vorbedingung des Wrappers:
      # Existiert die VM schon, meldet vmware_guest keine Aenderung und die
      # gemessene Zeit waere kuenstlich kurz.
      ansible.builtin.assert:
        that:
          - wab_deploy is changed
        fail_msg: "{{ inventory_hostname }} existierte bereits - Zyklus ungueltig."
        quiet: true
