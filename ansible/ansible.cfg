# ~/iac_lab/ansible/ansible.cfg
# Greift nur, wenn ansible-playbook aus diesem Verzeichnis gestartet wird.
#
# Bewusst NICHT hier gesetzt:
#   forks    - wird je Stufe per "-f <p>" uebergeben (Wrapper), identisch zu
#              Terraforms "-parallelism=<p>"; select_slots.yml erzwingt das.
#   strategy - steht explizit in den Plays (linear), nicht als globaler Default.

[defaults]
# Keine Inventardatei: die Ziel-Hosts (= VM-Namen) erzeugt select_slots.yml
# zur Laufzeit aus inventory.yaml. Es existiert nur das implizite localhost.
localhost_warning = False
retry_files_enabled = False
gathering = explicit
